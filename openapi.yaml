openapi: 3.0.3
info:
  title: Instanizer SMM Panel Reseller API
  version: "2"
  x-logo:
    url: https://instanizer.com/logo-512.png
    altText: Instanizer
  description: |
    Instanizer reseller API, compatible with the "SMM panel API v2" convention.
    A single endpoint (`POST /api/v2`) serves every action through the `action` parameter.

    **Key conventions**
    - The body may be `application/x-www-form-urlencoded` or `application/json`.
      Query string parameters are ignored so the API key never ends up in access logs.
    - Every error is returned as **HTTP 200** with the body `{ "error": "..." }`.
      Always check the `error` field, not just the HTTP status code.
    - Prices (`rate`) are in Indonesian Rupiah (IDR) per 1,000 units, exactly as billed.
    - Rate limits: 300 requests/minute per key, 60 orders/minute per key,
      30 authentication failures per 15 minutes per IP.
    - For `add`, send an `idempotency_key` so a retry after a dropped connection
      does not create a duplicate order.

    Full documentation: https://instanizer.com/en/api-docs
  contact:
    name: Instanizer
    url: https://instanizer.com
    email: support@instanizer.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: Instanizer API documentation
  url: https://instanizer.com/en/api-docs
servers:
  - url: https://api.instanizer.com
    description: Production
tags:
  - name: reseller
    description: Reseller actions (all through a single endpoint).
paths:
  /api/v2:
    post:
      tags: [reseller]
      operationId: resellerApi
      # Authentication is via the `key` body parameter, not an HTTP header.
      security: []
      summary: Run a reseller API action
      description: |
        Choose the action with the `action` field: `services`, `add`, `status`, `refill`,
        `refill_status`, `cancel`, or `balance`. The response shape depends on the action
        (see examples). Errors are always `{ "error": "..." }` with HTTP 200.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Request"
            examples:
              balance:
                summary: Balance
                value: { key: YOUR_API_KEY, action: balance }
              add:
                summary: Place an order
                value:
                  key: YOUR_API_KEY
                  action: add
                  service: 1
                  link: https://instagram.com/username
                  quantity: 1000
                  idempotency_key: order-0001
              statusMany:
                summary: Status of several orders
                value: { key: YOUR_API_KEY, action: status, orders: "23501,23502" }
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
      responses:
        "200":
          description: |
            Action result, or `{ "error": "..." }` on failure (errors also use status 200).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
              examples:
                services:
                  summary: action=services
                  value:
                    - service: 1
                      name: Instagram Followers | Real | Refill 30 Days
                      type: Default
                      category: Instagram Followers
                      rate: "12375"
                      min: "10"
                      max: "100000"
                      refill: true
                      cancel: false
                add:
                  summary: action=add
                  value: { order: 23501 }
                status:
                  summary: action=status (single order)
                  value:
                    charge: "12375.00"
                    start_count: "3572"
                    status: In progress
                    remains: "157"
                    currency: IDR
                statusMany:
                  summary: action=status with orders
                  value:
                    "23501":
                      charge: "12375.00"
                      start_count: "3572"
                      status: Partial
                      remains: "157"
                      currency: IDR
                    "99": { error: Incorrect order ID }
                refill:
                  summary: action=refill (single order)
                  value: { refill: 23501 }
                refillMany:
                  summary: action=refill with orders
                  value:
                    - { order: 23501, refill: 23501 }
                    - { order: 23502, refill: { error: This service does not support refill } }
                refillStatus:
                  summary: action=refill_status
                  value: { status: Completed }
                cancel:
                  summary: action=cancel
                  value:
                    - { order: 23501, cancel: 1 }
                    - { order: 99, cancel: { error: Incorrect order ID } }
                balance:
                  summary: action=balance
                  value: { balance: "250000.00", currency: IDR }
                error:
                  summary: Error (still HTTP 200)
                  value: { error: Invalid API key }
components:
  schemas:
    Request:
      description: One of seven request shapes, distinguished by `action`.
      oneOf:
        - $ref: "#/components/schemas/ServicesRequest"
        - $ref: "#/components/schemas/AddRequest"
        - $ref: "#/components/schemas/StatusRequest"
        - $ref: "#/components/schemas/RefillRequest"
        - $ref: "#/components/schemas/RefillStatusRequest"
        - $ref: "#/components/schemas/CancelRequest"
        - $ref: "#/components/schemas/BalanceRequest"
      discriminator:
        propertyName: action
        mapping:
          services: "#/components/schemas/ServicesRequest"
          add: "#/components/schemas/AddRequest"
          status: "#/components/schemas/StatusRequest"
          refill: "#/components/schemas/RefillRequest"
          refill_status: "#/components/schemas/RefillStatusRequest"
          cancel: "#/components/schemas/CancelRequest"
          balance: "#/components/schemas/BalanceRequest"

    ServicesRequest:
      type: object
      required: [key, action]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        action: { type: string, enum: [services] }
    BalanceRequest:
      type: object
      required: [key, action]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        action: { type: string, enum: [balance] }
    AddRequest:
      type: object
      required: [key, action, service]
      description: |
        Required parameters depend on the service `type`. For `Default`, only
        `service`, `link`, and `quantity` are needed.
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        action: { type: string, enum: [add] }
        service:
          type: integer
          minimum: 1
          description: Service ID from the `services` action.
        link:
          type: string
          description: Target link (profile, post, video).
        quantity:
          type: integer
          minimum: 1
          description: Number of units, between the service `min` and `max`.
        runs:
          type: integer
          description: Drip-feed, number of runs. Total charge = quantity x runs.
        interval:
          type: integer
          description: Drip-feed, interval between runs in minutes.
        comments:
          type: string
          description: Custom Comments / Comment Replies, one comment per line.
        usernames:
          type: string
          description: Mentions Custom List / with Hashtags, one username per line.
        username:
          type: string
          description: Mentions User Followers, Comment Likes, Comment Replies, Subscriptions.
        hashtag: { type: string, description: Mentions Hashtag. }
        hashtags: { type: string, description: Mentions with Hashtags. }
        keywords: { type: string, description: "SEO: keywords." }
        media: { type: string, description: "Mentions Media Likers: media link." }
        answer_number: { type: string, description: "Poll: answer number." }
        groups: { type: string, description: "Invites from Groups: list of groups." }
        country: { type: string, description: Web Traffic. }
        device: { type: string, description: Web Traffic. }
        type_of_traffic: { type: string, description: Web Traffic. }
        google_keyword: { type: string, description: Web Traffic. }
        min: { type: integer, description: Subscriptions. }
        max: { type: integer, description: Subscriptions. }
        posts: { type: integer, description: Subscriptions. }
        old_posts: { type: integer, description: Subscriptions. }
        delay: { type: integer, description: Subscriptions. }
        expiry: { type: string, description: Subscriptions. }
        idempotency_key:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
          description: |
            Optional. Repeating a request with the same key does not create a second
            order and returns the ID of the first order.
    StatusRequest:
      type: object
      required: [key, action]
      description: Send either `order` or `orders`.
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        action: { type: string, enum: [status] }
        order: { type: integer, minimum: 1, description: Order ID. }
        orders:
          type: string
          description: Several IDs separated by commas, maximum 100.
          example: "23501,23502"
    RefillRequest:
      type: object
      required: [key, action]
      description: Send either `order` or `orders`.
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        action: { type: string, enum: [refill] }
        order: { type: integer, minimum: 1 }
        orders:
          type: string
          description: Several IDs separated by commas, maximum 100.
    RefillStatusRequest:
      type: object
      required: [key, action]
      description: Send either `refill` or `refills`.
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        action: { type: string, enum: [refill_status] }
        refill: { type: integer, minimum: 1, description: Refill ID (same as the order ID). }
        refills:
          type: string
          description: Several IDs separated by commas, maximum 100.
    CancelRequest:
      type: object
      required: [key, action]
      description: Send `orders` (or a single ID via `order`).
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        action: { type: string, enum: [cancel] }
        order: { type: integer, minimum: 1 }
        orders:
          type: string
          description: IDs separated by commas, maximum 100.

    ApiKey:
      type: string
      description: Your API key (from the API Access page). Never put it in the query string.

    Response:
      description: The response shape depends on `action`; errors are always `Error`.
      anyOf:
        - $ref: "#/components/schemas/Error"
        - $ref: "#/components/schemas/ServiceList"
        - $ref: "#/components/schemas/AddResponse"
        - $ref: "#/components/schemas/OrderStatus"
        - $ref: "#/components/schemas/MultiStatus"
        - $ref: "#/components/schemas/RefillResponse"
        - $ref: "#/components/schemas/MultiRefill"
        - $ref: "#/components/schemas/RefillStatus"
        - $ref: "#/components/schemas/MultiRefillStatus"
        - $ref: "#/components/schemas/CancelResults"
        - $ref: "#/components/schemas/Balance"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Error message, e.g. `Invalid API key`, `Incorrect request`, `Incorrect service ID`,
            `Incorrect order ID`, `Incorrect refill ID`, `Not enough funds on balance`,
            `Maximum 100 IDs per request`, `Too many requests, please slow down`.
    Service:
      type: object
      required: [service, name, type, category, rate, min, max, refill, cancel]
      properties:
        service: { type: integer, description: Stable service ID; use it in `add`. }
        name: { type: string }
        type: { type: string, example: Default }
        category: { type: string }
        rate: { type: string, description: "Price per 1,000 units in Rupiah.", example: "12375" }
        min: { type: string, example: "10" }
        max: { type: string, example: "100000" }
        refill: { type: boolean }
        cancel: { type: boolean }
    ServiceList:
      type: array
      items: { $ref: "#/components/schemas/Service" }
    AddResponse:
      type: object
      required: [order]
      properties:
        order: { type: integer, description: Order ID. }
    OrderStatus:
      type: object
      required: [charge, start_count, status, remains, currency]
      properties:
        charge:
          type: string
          description: |
            Charge after refunds: Canceled = 0, Partial = price minus the refund
            for undelivered units.
          example: "12375.00"
        start_count: { type: string, example: "3572" }
        status:
          type: string
          enum: [Pending, Processing, In progress, Completed, Partial, Canceled]
        remains: { type: string, example: "157" }
        currency: { type: string, enum: [IDR] }
    MultiStatus:
      type: object
      description: Key = order ID as sent; value = status or error per ID.
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/OrderStatus"
          - $ref: "#/components/schemas/Error"
    RefillResponse:
      type: object
      required: [refill]
      properties:
        refill: { type: integer, description: Refill ID (same as the order ID). }
    MultiRefill:
      type: array
      items:
        type: object
        required: [order, refill]
        properties:
          order: { oneOf: [{ type: integer }, { type: string }] }
          refill:
            oneOf:
              - { type: integer }
              - { $ref: "#/components/schemas/Error" }
    RefillStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, example: Completed }
    MultiRefillStatus:
      type: array
      items:
        type: object
        required: [refill, status]
        properties:
          refill: { oneOf: [{ type: integer }, { type: string }] }
          status:
            oneOf:
              - { type: string }
              - { $ref: "#/components/schemas/Error" }
    CancelResults:
      type: array
      items:
        type: object
        required: [order, cancel]
        properties:
          order: { oneOf: [{ type: integer }, { type: string }] }
          cancel:
            description: "`1` if the cancellation is accepted, or an error object."
            oneOf:
              - { type: integer, enum: [1] }
              - { $ref: "#/components/schemas/Error" }
    Balance:
      type: object
      required: [balance, currency]
      properties:
        balance: { type: string, example: "250000.00" }
        currency: { type: string, enum: [IDR] }
